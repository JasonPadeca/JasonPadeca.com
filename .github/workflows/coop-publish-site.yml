# Publish website edits made in the admin site.
#
# Administrators edit the public pages from Admin → Website. Those edits live in
# the database; this job bakes them into the real HTML and commits, so visitors
# get a plain static page with the current wording already in it.
#
# Runs every ten minutes. That is the delay between somebody pressing Save and
# the change appearing, and the admin screen says so rather than leaving them
# wondering. Also runnable by hand from the Actions tab when somebody does not
# want to wait.
#
# No secrets. site_content is deliberately readable with the publishable key
# that is already printed in the site's own source — it holds the words on a
# public website and nothing else. See the note in 0021_site_content.sql.

name: Publish site edits

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Only what is needed to commit the rewritten pages back.
permissions:
  contents: write

# A slow run must not overlap the next scheduled one and fight it over the same
# files.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Photographs are uploaded from phones and arrive enormous. Pillow shrinks
      # them before they reach the front page.
      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Apply edits to the public pages
        run: python3 coop/tools/publish-site.py coop

      - name: Commit if anything changed
        run: |
          # The mirrored pages, and the photographs they point at. The
          # publisher writes nothing else, so anything else showing as changed
          # is not ours to commit.
          if [ -z "$(git status --porcelain -- 'coop/*.html' 'coop/**/*.html' 'coop/site')" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name  "koinonia-site-bot"
          git config user.email "actions@github.com"
          git add -- 'coop/*.html' 'coop/**/*.html' 'coop/site'
          git commit -m "Publish website edits made in the admin site

          Generated by .github/workflows/coop-publish-site.yml from the
          site_content table. Edit the wording in Admin → Website rather than
          changing these files by hand — the next run would overwrite you."
          git push
