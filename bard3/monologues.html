ices","r":"Long"},{"s":"Ulysses","t":"Troilus and Cressida","x":"M","d":"","g":"Tragedies","p":"tro","w":"act 1 sc 3","l":63,"o":"Troy, yet upon his basis, had been down, And the great Hector&#x27;s sword had lack&#x27;d a master,","r":"Long"},{"s":"Hamlet","t":"Hamlet","x":"M","d":"","g":"Tragedies","p":"ham","w":"act 2 sc 2","l":58,"o":"Ay, so, God b&#x27; wi&#x27; ye. Now I am alone. O what a rogue and peasant slave am I!","r":"Long"},{"s":"King","t":"Henry VIII","x":"M","d":"","g":"Histories","p":"h8","w":"act 2 sc 4","l":55,"o":"My Lord Cardinal, I do excuse you; yea, upon mine honour,","r":"Long"},{"s":"Berowne","t":"Love's Labour's Lost","x":"M","d":"","g":"Comedies","p":"lll","w":"act 4 sc 3","l":55,"o":"O, &#x27;tis more than need. Have at you, then, affection&#x27;s men-at-arms.","r":"Long"},{"s":"King Henry","t":"Henry VI, Part 3","x":"M","d":"","g":"Histories","p":"3h6","w":"act 2 sc 5","l":54,"o":"This battle fares like to the morning&#x27;s war, When dying clouds contend with growing light,","r":"Long"},{"s":"King Henry","t":"Henry V","x":"M","d":"","g":"Histories","p":"h5","w":"act 4 sc 1","l":54,"o":"Our debts, our careful wives, Our children, and our sins lay on the King!","r":"Long"},{"s":"York","t":"Henry VI, Part 2","x":"M","d":"","g":"Histories","p":"2h6","w":"act 3 sc 1","l":53,"o":"Now, York, or never, steel thy fearful thoughts, And change misdoubt to resolution.","r":"Long"},{"s":"Chorus","t":"Henry V","x":"O","d":"","g":"Histories","p":"h5","w":"act 4 sc prologue","l":53,"o":"Now entertain conjecture of a time When creeping murmur and the poring dark","r":"Long"},{"s":"Gower","t":"Pericles","x":"M","d":"","g":"Comedies","p":"per","w":"act 4 sc chorus","l":52,"o":"Imagine Pericles arrived at Tyre, Welcomed and settled to his own desire.","r":"Long"},{"s":"Friar Lawrence","t":"Romeo and Juliet","x":"M","d":"","g":"Tragedies","p":"rom","w":"act 3 sc 3","l":51,"o":"Hold thy desperate hand. Art thou a man? Thy form cries out thou art.","r":"Long"},{"s":"King","t":"Henry V","x":"M","d":"","g":"Histories","p":"h5","w":"act 4 sc 3","l":50,"o":"What&#x27;s he that wishes so? My cousin Westmorland? No, my fair cousin.","r":"Long"},{"s":"Queen Margaret","t":"Henry VI, Part 2","x":"F","d":"","g":"Histories","p":"2h6","w":"act 3 sc 2","l":49,"o":"Be woe for me, more wretched than he is. What, dost thou turn away and hide thy face?","r":"Long"},{"s":"Ghost","t":"Hamlet","x":"O","d":"","g":"Tragedies","p":"ham","w":"act 1 sc 5","l":49,"o":"Ay, that incestuous, that adulterate beast, With witchcraft of his wit, with traitorous gifts,--","r":"Long"},{"s":"Prince Of Morocco","t":"The Merchant of Venice","x":"M","d":"","g":"Comedies","p":"mv","w":"act 2 sc 7","l":48,"o":"Some god direct my judgment! Let me see. I will survey the inscriptions back again.","r":"Long"},{"s":"Marcus","t":"Titus Andronicus","x":"M","d":"","g":"Tragedies","p":"tit","w":"act 2 sc 4","l":47,"o":"Who is this? My niece, that flies away so fast? Cousin, a word; where is your husband?","r":"Long"},{"s":"King","t":"Henry IV, Part 2","x":"M","d":"","g":"Histories","p":"2h4","w":"act 4 sc 5","l":46,"o":"Thy wish was father, Harry, to that thought. I stay too long by thee, I weary thee.","r":"Long"},{"s":"York","t":"Henry VI, Part 2","x":"M","d":"","g":"Histories","p":"2h6","w":"act 1 sc 1","l":46,"o":"Anjou and Maine are given to the French; Paris is lost; the state of Normandy","r":"Long"},{"s":"Gower","t":"Pericles","x":"M","d":"","g":"Comedies","p":"per","w":"act 3 sc chorus","l":46,"o":"By many a dern and painful perch Of Pericles the careful search,","r":"Long"},{"s":"King Richard","t":"Richard III","x":"M","d":"","g":"Histories","p":"r3","w":"act 4 sc 4","l":46,"o":"Look what is done cannot be now amended. Men shall deal unadvisedly sometimes,","r":"Long"},{"s":"Ulysses","t":"Troilus and Cressida","x":"M","d":"","g":"Tragedies","p":"tro","w":"act 3 sc 3","l":46,"o":"Time hath, my lord, a wallet at his back, Wherein he puts alms for oblivion,","r":"Long"},{"s":"Chorus","t":"Henry V","x":"O","d":"","g":"Histories","p":"h5","w":"act 5 sc prologue","l":45,"o":"Vouchsafe to those that have not read the story, That I may prompt them; and of such as have,","r":"Long"},{"s":"Burgundy","t":"Henry V","x":"M","d":"","g":"Histories","p":"h5","w":"act 5 sc 2","l":45,"o":"My duty to you both, on equal love, Great Kings of France and England! That I have labour&#x27;d,","r":"Long"},{"s":"Queen Katherine","t":"Henry VIII","x":"F","d":"","g":"Histories","p":"h8","w":"act 2 sc 4","l":45,"o":"Sir, I desire you do me right and justice, And to bestow your pity on me; for","r":"Long"},{"s":"King","t":"Henry IV, Part 2","x":"M","d":"","g":"Histories","p":"2h4","w":"act 5 sc 2","l":44,"o":"You are right, justice, and you weigh this well. Therefore still bear the balance and the sword.","r":"Long"},{"s":"Katherina","t":"The Taming of the Shrew","x":"F","d":"","g":"Comedies","p":"shr","w":"act 5 sc 2","l":44,"o":"Fie, fie! unknit that threatening unkind brow, And dart not scornful glances from those eyes","r":"Long"},{"s":"King","t":"Henry IV, Part 2","x":"M","d":"","g":"Histories","p":"2h4","w":"act 4 sc 5","l":43,"o":"O my son, God put it in thy mind to take it hence,","r":"Long"},{"s":"King Henry","t":"Henry V","x":"M","d":"","g":"Histories","p":"h5","w":"act 3 sc 3","l":43,"o":"How yet resolves the governor of the town? This is the latest parle we will admit;","r":"Long"},{"s":"Othello","t":"Othello","x":"M","d":"","g":"Tragedies","p":"oth","w":"act 1 sc 3","l":43,"o":"Her father lov&#x27;d me, oft invited me, Still question&#x27;d me the story of my life,","r":"Long"},{"s":"Mercutio","t":"Romeo and Juliet","x":"M","d":"","g":"Tragedies","p":"rom","w":"act 1 sc 4","l":43,"o":"O, then, I see Queen Mab hath been with you. She is the fairies&#x27; midwife, and she comes","r":"Long"},{"s":"Proteus","t":"The Two Gentlemen of Verona","x":"M","d":"","g":"Comedies","p":"tgv","w":"act 2 sc 6","l":43,"o":"To leave my Julia, shall I be fo const D=DATA,box=document.getElementById('rows'),n=document.getElementById('n');
const sels=[...document.querySelectorAll('.filters select')];
const q=document.getElementById('q');
function show(){
 const f={};sels.forEach(s=>f[s.dataset.k]=s.value);
 const v=(q?q.value:'').trim().toLowerCase();
 const hit=D.filter(r=>{
  for(const k in f){if(f[k]&&String(r[k])!==f[k])return false;}
  return !v||r.s.toLowerCase().includes(v)||r.t.toLowerCase().includes(v);});
 n.textContent=hit.length.toLocaleString()+' of '+D.length.toLocaleString();
 box.innerHTML=hit.slice(0,600).map(r=>
  '<div class="row"><span class="who">'+r.s+'</span>'+
  '<span class="meta">'+r.t+(r.w?' &middot; '+r.w:'')+
  ' &middot; '+r.l+' lines</span>'+
  (r.o?'<span class="said">'+r.o+'</span>':'')+'</div>').join('')+
  (hit.length>600?'<p class="note">showing the first 600</p>':'');}
sels.forEach(s=>s.addEventListener('change',show));
if(q)q.addEventListener('input',show);show();
